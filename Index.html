<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonziclicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #8E374D;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #logo {
            max-width: 150px;
            margin-bottom: 15px;
        }
        #clicker {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            cursor: pointer;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            user-select: none;
            transition: transform 0.1s;
            background-image: url('https://i.postimg.cc/RhZVgcZG/384-20250516042254.png');
            background-size: cover;
        }
        #clicker:active {
            transform: scale(0.95);
        }
        .skins {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .skin {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ddd;
            background-size: cover;
        }
        .skin.selected {
            border-color: #4CAF50;
        }
        #shop-button {
            padding: 8px 16px;
            background-color: #7E2B40;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 0;
        }
        #shop {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 100;
            width: 90%;
            max-width: 400px;
        }
        .upgrade {
            padding: 10px;
            margin: 10px 0;
            background-color: #AC3E43;
            border-radius: 5px;
        }
        .buy-button {
            padding: 5px 10px;
            background-color: #7E2B40;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 5px;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color:#AC3E43 rgba(0,0,0,0.5);
            z-index: 50;
        }
        .upgrade-info {
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="logo" src="https://i.postimg.cc/cLyGHRGj/382-20250516040750.png" alt="Лого">
        
        <div id="score">Троянов: 0</div>
        <div id="clicker"></div>
        
        <div class="skins">
            <div class="skin selected" style="background-image: url('https://i.postimg.cc/RhZVgcZG/384-20250516042254.png')"></div>
            <div class="skin" style="background-image: url('https://i.postimg.cc/SNKJdpXq/384-20250516042138.png')"></div>
            <div class="skin" style="background-image: url('https://i.postimg.cc/pdKTrWSQ/384-20250516042219.png')"></div>
        </div>
        
        <button id="shop-button">ШОП</button>
    </div>

    <div id="overlay"></div>
    
    <div id="shop">
        <h2>ШОП</h2>
        <div class="upgrade">
            <h3>Удвоение кликов</h3>
            <p>+1 к клику (текущий уровень: <span id="power-level">1</span>)</p>
            <p>Цена: <span id="power-price">50</span></p>
            <div class="upgrade-info">Каждый уровень увеличивает стоимость на 50%</div>
            <button class="buy-button" onclick="buyUpgrade('power')">Купить</button>
        </div>
        
        <div class="upgrade">
            <h3>Автокликер</h3>
            <p><span id="auto-level">0</span> кликов в секунду</p>
            <p>Цена: <span id="auto-price">100</span></p>
            <div class="upgrade-info">Каждый уровень увеличивает скорость и стоимость на 100%</div>
            <button class="buy-button" onclick="buyUpgrade('auto')">Купить</button>
        </div>
        
        <div class="upgrade">
            <h3>Скин "Айки"</h3>
            <p>Эксклюзивный скин</p>
            <p>Цена: 150</p>
            <button class="buy-button" onclick="buyUpgrade('skin')">Купить</button>
        </div>
        
        <button onclick="closeShop()" style="margin-top: 10px;">Закрыть</button>
    </div>

    <script>
        // Игровые переменные
        let score = 0;
        let power = 1;
        let powerLevel = 1;
        let powerPrice = 50;
        let autoClicker = 0;
        let autoLevel = 0;
        let autoPrice = 100;
        let hasCustomSkin = false;
        let autoInterval;
        
        // Элементы
        const clicker = document.getElementById('clicker');
        const scoreElement = document.getElementById('score');
        const skins = document.querySelectorAll('.skin');
        const shopButton = document.getElementById('shop-button');
        const shop = document.getElementById('shop');
        const overlay = document.getElementById('overlay');
        
        // Загрузка сохранений
        function loadGame() {
            const savedData = localStorage.getItem('bonziClickerSave');
            if (savedData) {
                const data = JSON.parse(savedData);
                score = data.score || 0;
                power = data.power || 1;
                powerLevel = data.powerLevel || 1;
                powerPrice = data.powerPrice || 50;
                autoClicker = data.autoClicker || 0;
                autoLevel = data.autoLevel || 0;
                autoPrice = data.autoPrice || 100;
                hasCustomSkin = data.hasCustomSkin || false;
                
                updateShopUI();
                updateScore();
                
                if (autoClicker > 0) {
                    startAutoClicker();
                }
                
                if (hasCustomSkin) {
                    addCustomSkin();
                }
            }
        }
        
        // Сохранение игры
        function saveGame() {
            const data = {
                score,
                power,
                powerLevel,
                powerPrice,
                autoClicker,
                autoLevel,
                autoPrice,
                hasCustomSkin
            };
            localStorage.setItem('bonziClickerSave', JSON.stringify(data));
        }
        
        // Инициализация
        function init() {
            loadGame();
            
            // Кликер
            clicker.addEventListener('click', () => {
                score += power;
                updateScore();
                animateClick();
                saveGame();
            });
            
            // Скины
            skins.forEach(skin => {
                skin.addEventListener('click', function() {
                    selectSkin(this);
                });
            });
            
            // Магазин
            shopButton.addEventListener('click', openShop);
            
            // Автосохранение каждые 10 секунд
            setInterval(saveGame, 10000);
        }
        
        // Обновление счета
        function updateScore() {
            scoreElement.textContent = `Троянов: ${score}`;
        }
        
        // Обновление UI магазина
        function updateShopUI() {
            document.getElementById('power-level').textContent = powerLevel;
            document.getElementById('power-price').textContent = powerPrice;
            document.getElementById('auto-level').textContent = autoClicker;
            document.getElementById('auto-price').textContent = autoPrice;
        }
        
        // Анимация клика
        function animateClick() {
            clicker.style.transform = 'scale(0.95)';
            setTimeout(() => {
                clicker.style.transform = 'scale(1)';
            }, 100);
        }
        
        // Выбор скина
        function selectSkin(skin) {
            skins.forEach(s => s.classList.remove('selected'));
            skin.classList.add('selected');
            
            const bg = skin.style.backgroundImage;
            clicker.style.backgroundImage = bg;
        }
        
        // Магазин
        function openShop() {
            shop.style.display = 'block';
            overlay.style.display = 'block';
        }
        
        function closeShop() {
            shop.style.display = 'none';
            overlay.style.display = 'none';
        }
        
        // Покупка улучшений
        function buyUpgrade(type) {
            let cost, canBuy = false;
            
            switch(type) {
                case 'power':
                    cost = powerPrice;
                    if (score >= cost) {
                        score -= cost;
                        power += 1;
                        powerLevel += 1;
                        powerPrice = Math.floor(powerPrice * 1.5);
                        canBuy = true;
                        updateShopUI();
                    }
                    break;
                    
                case 'auto':
                    cost = autoPrice;
                    if (score >= cost) {
                        score -= cost;
                        autoClicker += 1;
                        autoLevel += 1;
                        autoPrice = Math.floor(autoPrice * 2);
                        canBuy = true;
                        updateShopUI();
                        startAutoClicker();
                    }
                    break;
                    
                case 'skin':
                    cost = 150;
                    if (score >= cost && !hasCustomSkin) {
                        score -= cost;
                        hasCustomSkin = true;
                        addCustomSkin();
                        canBuy = true;
                    }
                    break;
            }
            
            if (canBuy) {
                updateScore();
                saveGame();
                closeShop();
            } else {
                alert("Недостаточно Троянов или уже куплено!");
            }
        }
        
        // Автокликер
        function startAutoClicker() {
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = setInterval(() => {
                score += power * autoClicker;
                updateScore();
                saveGame();
            }, 1000);
        }
        
        // Добавление кастомного скина
        function addCustomSkin() {
            const skinsDiv = document.querySelector('.skins');
            const newSkin = document.createElement('div');
            newSkin.className = 'skin';
            newSkin.style.backgroundImage = "url('https://i.postimg.cc/mDGPyz96/383-20250516041741.png')";
            skinsDiv.appendChild(newSkin);
            
            newSkin.addEventListener('click', function() {
                selectSkin(this);
            });
        }
        
        // Запуск игры
        init();
    </script>
</body>
            </html>
